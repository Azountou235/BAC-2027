<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BAC TCHAD 2027 — Mode Hors Ligne</title>
  <style>
    :root {
      --primary: #0d9488;
      --bg: #0b0f19;
      --card: #151b28;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: var(--card);
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .icon-container {
      width: 72px;
      height: 72px;
      background: rgba(13, 148, 136, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: var(--primary);
    }
    .flag-accent {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-bottom: 16px;
    }
    .flag-bar {
      width: 14px;
      height: 4px;
      border-radius: 2px;
    }
    .flag-blue { background-color: #002664; }
    .flag-yellow { background-color: #fecb00; }
    .flag-red { background-color: #c60c30; }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: var(--subtext);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 20px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #0f766e;
    }
    .offline-tip {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="flag-accent">
      <div class="flag-bar flag-blue"></div>
      <div class="flag-bar flag-yellow"></div>
      <div class="flag-bar flag-red"></div>
    </div>
    <div class="icon-container">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Vous êtes hors connexion</h1>
    <p>La connexion internet est instable ou coupée. Vos messages récents enregistrés localement restent accessibles dès le retour du réseau.</p>
    <button class="btn" onclick="window.location.reload()">Réessayer la connexion</button>
    <div class="offline-tip">
      BAC TCHAD 2027 — Ensemble vers le BAC 2027
    </div>
  </div>
</body>
</html>
